<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About // Patt</title>
    <meta name="description" content="About Patt — designer, film lover, writer." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/reveal-text.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="navbar" id="navbar">
      <div class="container nav-inner">
        <a href="index.html" class="brand" id="brandLogo" data-cursor
          >Patt<span>*</span></a
        >
        <nav class="nav-links" id="navLinks">
          <a href="about.html" class="nav-link" data-cursor>About</a>
          <a href="work.html" class="nav-link" data-cursor>Work</a>
          <a href="contact.html" class="nav-link" data-cursor>Contact</a>
        </nav>
        <div class="nav-actions">
          <button
            class="menu-btn"
            id="menuBtn"
            aria-label="Open menu"
            aria-expanded="false"
          >
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="section" id="about">
        <div class="container">
          <div class="section-head reveal">
            <span class="section-index">(01)</span>
            <h2 class="section-title">About</h2>
          </div>

          <div class="about-grid">
            <!-- The paragraph animates itself per line (reveal-text.js),
                 so the wrapper no longer carries .reveal — two fades on
                 the same text read as one sluggish one. -->
            <div class="about-text">
              <p id="aboutText" data-reveal-text>
                Hi! I'm a designer who believes good design is felt, not just
                seen.
              </p>
              <div class="skills reveal" id="skillsList"></div>
            </div>

            <aside class="about-side reveal">
              <div class="avatar" id="avatarBox">YN</div>
              <ul class="stats" id="statsList"></ul>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <span id="footerName">© <span id="year"></span> Patt</span>
        <span class="footer-credit">Designed &amp; built with ☕</span>
        <a href="index.html" class="back-top" data-cursor>Home</a>
      </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/about.js"></script>
    <!-- Load after core.js so #aboutText already contains siteData copy. -->
    <script src="js/reveal-text.js"></script>
  </body>
</html>
