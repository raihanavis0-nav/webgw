<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patt // Designer</title>
    <meta
      name="description"
      content="Design portfolio and films watched by Patt."
    />
    <meta property="og:title" content="Patt — Portfolio" />
    <meta
      property="og:description"
      content="Design portfolio and films watched."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/typer.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/glass.css" />
  </head>
  <body class="home-editorial">
    <!-- ===================== PAGE TRANSITION ===================== -->
    <div class="page-curtain" id="pageCurtain" aria-hidden="true">
      <span class="curtain-mark">✦</span>
    </div>

    <div class="grain" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="navbar" id="navbar">
      <div class="container nav-inner">
        <a
          href="index.html"
          class="brand editorial-logo"
          id="brandLogo"
          data-static-brand="true"
          data-cursor
          >P.</a
        >
        <nav class="nav-links" id="navLinks">
          <a href="about.html" class="nav-link" data-cursor>About</a>
          <a href="work.html" class="nav-link" data-cursor>Work</a>
          <a href="contact.html" class="nav-link" data-cursor>Contact</a>
        </nav>
        <div class="nav-actions">
          <button
            class="menu-btn"
            id="menuBtn"
            aria-label="Open menu"
            aria-expanded="false"
          >
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- ===================== HERO ===================== -->
      <section class="hero" id="hero">
        <div class="container hero-inner hero-centered">
          <div class="hero-dia-glow" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
          <h1
            class="hero-typer"
            data-typer
            data-typer-loop
            data-typer-type="initial"
          >
            Hey, it's patt!
          </h1>
          <!-- Bottom bar: three balanced columns so the dock is optically
               centred and neither corner is left empty. -->
          <div class="home-bar">
            <span class="home-meta" id="homeMeta"></span>
            <nav
              class="home-dock"
              id="homeDock"
              aria-label="Featured sections"
            ></nav>
            <a
              href="mailto:failnauqht@gmail.com"
              class="home-email"
              id="homeEmail"
              data-cursor
              >failnauqht@gmail.com</a
            >
          </div>
        </div>
      </section>

    </main>

    <!-- Fullscreen homepage navigation, built by js/menu.js. -->
    <div class="mega-menu" id="megaMenu" aria-hidden="true">
      <button class="mega-close" type="button" aria-label="Close menu">✕</button>
      <nav class="mega-nav" aria-label="Main menu"></nav>
      <div class="mega-foot">
        <a href="mailto:failnauqht@gmail.com" data-cursor>failnauqht@gmail.com</a>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/home.js"></script>
    <script src="js/typer.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/glass.js"></script>
  </body>
</html>
