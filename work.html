<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work // Patt</title>
    <meta name="description" content="Selected design work by Patt." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/glass.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <header class="navbar" id="navbar">
      <div class="container nav-inner">
        <a href="index.html" class="brand" id="brandLogo" data-cursor
          >Patt<span>*</span></a
        >
        <nav class="nav-links" id="navLinks">
          <a href="about.html" class="nav-link" data-cursor>About</a>
          <a href="work.html" class="nav-link" data-cursor>Work</a>
          <a href="contact.html" class="nav-link" data-cursor>Contact</a>
        </nav>
        <div class="nav-actions">
          <button
            class="menu-btn"
            id="menuBtn"
            aria-label="Open menu"
            aria-expanded="false"
          >
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="section" id="work">
        <div class="container">
          <div class="section-head reveal">
            <span class="section-index">Portfolio / Explore</span>
            <h2 class="section-title">Browse the work.</h2>
            <p class="section-sub">
              Pick a collection, open it, and see every piece inside - posters,
              infographics, and social-media design.
            </p>
          </div>

          <div class="filters" id="projectFilters"></div>
          <div class="album-grid" id="projectGrid"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <span id="footerName">© <span id="year"></span> Patt</span>
        <span class="footer-credit">Designed &amp; built with ☕</span>
        <a href="index.html" class="back-top" data-cursor>Home</a>
      </div>
    </footer>

    <!-- Collection overlay: opens an album (multiple images) as its own view -->
    <div class="collection" id="collection" aria-hidden="true">
      <button class="col-close" id="colClose" aria-label="Close album">✕</button>
      <div class="col-inner">
        <header class="col-head">
          <span class="col-kicker" id="colKicker"></span>
          <h2 class="col-title" id="colTitle"></h2>
          <p class="col-desc" id="colDesc"></p>
        </header>
        <div class="album-grid collection-grid" id="colGrid"></div>
      </div>
    </div>

    <!-- Lightbox: full-size preview, fits any image resolution -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
      <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">‹</button>
      <figure class="lb-figure">
        <img id="lbImg" src="" alt="" />
        <figcaption class="lb-caption" id="lbCaption"></figcaption>
      </figure>
      <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
    </div>

    <script src="js/data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/work.js"></script>
    <script src="js/glass.js"></script>
  </body>
</html>
