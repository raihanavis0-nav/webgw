name: Build gallery manifest

# Runs whenever images are added/removed in assets/img/.
# Regenerates assets/img/manifest.json so the Work album updates itself.
on:
  push:
    paths:
      - "assets/img/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate manifest
        run: node scripts/build-gallery.js

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img/manifest.json
          if git diff --staged --quiet; then
            echo "No manifest changes."
          else
            git commit -m "chore: update gallery manifest [skip ci]"
            git push
          fi
