name: Bundle Plotwell Script Editor

on:
  push:
    branches:
      - feature/plotwell-screenplay-editor-20261019
    paths:
      - 'tools/plotwell-build/**'
      - '.github/workflows/build-plotwell.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned editor dependencies
        working-directory: tools/plotwell-build
        run: npm install --no-audit --no-fund
      - name: Bundle browser editor and CSS
        working-directory: tools/plotwell-build
        run: npm run bundle
      - name: Check generated bundles
        run: |
          test -s js/vendor/plotwell.bundle.js
          test -s css/vendor/plotwell.css
          node --check js/vendor/plotwell.bundle.js
      - name: Commit generated browser assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/vendor/plotwell.bundle.js css/vendor/plotwell.css tools/plotwell-build/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(script): bundle pinned Plotwell editor for browser'
            git push origin HEAD:feature/plotwell-screenplay-editor-20261019
          fi
