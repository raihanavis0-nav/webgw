name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find api server js scripts -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Validate Vercel config
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
