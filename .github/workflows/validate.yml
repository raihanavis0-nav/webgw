name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find api server js scripts -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Test portfolio admin parser
        run: node scripts/test-site-admin.js

      - name: Test Reader appearance, auth and publishing
        run: node --test scripts/test-reader-regressions.js

      - name: Test community book ratings
        run: node --test scripts/test-book-ratings.js
      
      - name: Test Writer/Reader activity and public-feed privacy
        run: node --test scripts/test-story-activity.js scripts/test-writer-reader-activity.js

      - name: Test dedicated Script mode
        run: node --test scripts/test-script-mode.js

      - name: Test Script page-break layout regression
        run: node --test scripts/test-plotwell-page-separator.js

      - name: Test PDF and Word document exports
        run: node --test scripts/test-story-export.js

      - name: Test dialogue speaker spacing
        run: node --test scripts/test-script-dialogue-spacing.js

      - name: Test PDF and Word Story imports
        run: node --test scripts/test-story-import.js

      - name: Test Plotwell document adapter
        run: node --test scripts/test-script-plotwell-bridge.js

      - name: Guard Vercel Hobby Function budget and auth routing
        run: node --test scripts/test-function-budget.js

      - name: Test chronological Reader timeline
        run: node --test scripts/test-timeline.js

      - name: Validate Vercel config
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
