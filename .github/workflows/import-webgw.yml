name: Import website archive

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact source commit
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             "https://codeload.github.com/alfathxxxxyz/websiteguaa/zip/39911847b4ad00aa7f11d217e45b18c909dce5b4"             -o /tmp/website.zip
          rm -rf /tmp/website-import
          mkdir -p /tmp/website-import
          unzip -q /tmp/website.zip -d /tmp/website-import

      - name: Copy website into repository root
        shell: bash
        run: |
          set -euo pipefail
          ROOT_DIR="$(find /tmp/website-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT_DIR"
          shopt -s dotglob nullglob
          cp -a "$ROOT_DIR"/. .
          rm -f .github/workflows/import-webgw.yml

      - name: Commit imported website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import website from uploaded archive"
          git push
