      - name: Remove temporary import files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import
          rm -f .github/workflows/import-webgw.yml

      - name: Commit exact uploaded website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import website from uploaded archive"
          git push
