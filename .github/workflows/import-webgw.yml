name: Import uploaded website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract text files from uploaded archive payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .import/text.b64
          base64 -d .import/text.b64 > /tmp/text-only.zip
          rm -rf /tmp/text-import
          mkdir -p /tmp/text-import
          unzip -q /tmp/text-only.zip -d /tmp/text-import
          ROOT_DIR="$(find /tmp/text-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT_DIR"
          shopt -s dotglob nullglob
          cp -a "$ROOT_DIR"/. .

      - name: Restore exact binary assets
        shell: bash
        run: |
          set -euo pipefail
          PROBE_PATH="assets/img/Failnauqht_Outline_wide.png"
          PROBE_SHA="9c8686947096e9570fc089f2e9aad2fea8b46ed05d5b2a5feed198fa65807e9b"
          ASSET_BASE=""

          for base in "https://h00dle.xyz" "https://websiteguaa.vercel.app"; do
            echo "Probing $base"
            if curl -L --fail --silent --show-error --connect-timeout 8 --max-time 30 "$base/$PROBE_PATH" -o /tmp/probe-asset; then
              got="$(sha256sum /tmp/probe-asset | awk '{print $1}')"
              if [ "$got" = "$PROBE_SHA" ]; then
                ASSET_BASE="$base"
                break
              fi
            fi
          done

          if [ -z "$ASSET_BASE" ]; then
            echo "No live asset source matched the uploaded archive."
            exit 1
          fi

          echo "Using exact-match asset source: $ASSET_BASE"

          while read -r expected path; do
            [ -n "$expected" ] || continue
            mkdir -p "$(dirname "$path")"
            tmp="$(mktemp)"
            curl -L --fail --silent --show-error --connect-timeout 8 --max-time 60 "$ASSET_BASE/$path" -o "$tmp"
            got="$(sha256sum "$tmp" | awk '{print $1}')"
            if [ "$got" != "$expected" ]; then
              echo "Hash mismatch: $path"
              echo "expected=$expected"
              echo "got=$got"
              rm -f "$tmp"
              exit 1
            fi
            mv "$tmp" "$path"
            echo "verified $path"
          done <<'ASSETS'
