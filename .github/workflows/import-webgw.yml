name: Finalize uploaded website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact text files
        shell: bash
        run: |
          set -euo pipefail
          test -f .import/text.b64
          base64 -d .import/text.b64 > /tmp/text-only.zip
          rm -rf /tmp/text-import
          mkdir -p /tmp/text-import
          unzip -q /tmp/text-only.zip -d /tmp/text-import
          ROOT_DIR="$(find /tmp/text-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT_DIR"
          shopt -s dotglob nullglob
          cp -a "$ROOT_DIR"/. .

      - name: Verify imported structure
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f README.md
          test -f vercel.json
          test -f assets/img/profile-patt.webp
          test -f assets/img/designs/designs-04.webp
          test -f assets/img/f1/f1-15.webp
          test -f api/thoughts/content.js
          test -f server/thoughts-store.js
          count="$(find assets/img -type f | wc -l)"
          echo "Asset files: $count"
          [ "$count" -ge 49 ]

      - name: Remove temporary import files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import
          rm -f .github/workflows/import-webgw.yml

      - name: Commit imported website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import website from uploaded archive"
          git push
